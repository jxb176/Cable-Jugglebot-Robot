[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jugglebot"
version = "0.1.0"
description = "Modular robotics control framework for cable and Stewart platforms"
authors = [{ name = "Jon", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

# Optional dependency groups
[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "mypy",
]
gui = [
    "PyQt6>=6.6",
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
]
sim = [
    "mujoco",
    "matplotlib",
]
optimization = [
    "osqp",
]
hardware = [
    "python-can>=4.0",
]
spacemouse = [
    "pyspacemouse>=2.0",
]

# Command line entry points
[project.scripts]
robotd = "jugglebot.apps.robotd:main"
simd = "jugglebot.apps.simd:main"
plantraj = "jugglebot.apps.plantraj:main"
playtraj = "jugglebot.apps.playtraj:main"
reviewlog = "jugglebot.apps.reviewlog:main"
controlui = "jugglebot.apps.controlui:main"
patternui = "jugglebot.apps.patternui:main"
bsplineui = "jugglebot.apps.bsplineui:main"

[tool.setuptools.package-data]
"jugglebot.patterns" = ["examples/*.yaml"]
